name: Scan funding sources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/scan.py'
      - 'src/programme_monitor.py'
      - 'src/programme_ingest.py'
      - 'src/funder_registry.py'
      - 'config/funders.json'
      - 'src/scan_integrity.py'
      - 'src/notify.py'
      - 'src/catalog.py'
      - 'src/issuer_sources.py'
      - 'config/issuer_checks.json'
      - 'config/reviewed_official_facts.json'
      - 'src/reviewed_official.py'
      - 'src/source_alternatives.py'
      - 'src/eu_api.py'
      - 'src/verification.py'
      - 'src/classify.py'
      - 'src/detail.py'
      - 'src/evidence.py'
      - 'src/catalog_changes.py'
      - 'src/public_ids.py'
      - 'src/quality.py'
      - 'src/status.py'
      - 'src/fit.py'
      - 'src/assessment_reviews.py'
      - 'src/assessment_coverage.py'
      - 'src/adequacy.py'
      - 'src/eligibility_conditions.py'
      - 'src/eligibility_specific.py'
      - 'src/applicant_comparison.py'
      - 'src/open_review_queue.py'
      - 'config/applicant_profile.json'
      - 'config/assessment_reviews.json'
      - 'src/pdf_dates.py'
      - 'src/pdf_evidence.py'
      - 'src/structured.py'
      - 'src/priority.py'
      - 'src/crt_windows.py'
      - 'config/priority_pages.json'
      - 'config/sources.json'
      - '.github/workflows/scan.yml'
  schedule:
    # Avoid the top-of-hour GitHub Actions scheduling congestion.
    # Daily discovery/review, including weekends: new calls never wait for Monday.
    - cron: '23 6 * * *'
permissions:
  contents: write
concurrency:
  group: funding-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan funding sources
        id: scan
        run: python src/scan.py
      - name: Verify scan integrity before notifications and publication
        id: integrity
        run: python src/scan_integrity.py
      - name: Notify on newly open relevant calls
        id: notify
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FUNDING_ALERT_RECIPIENT: ${{ secrets.FUNDING_ALERT_RECIPIENT }}
        run: python src/notify.py
      - name: Commit updated public data
        if: ${{ !cancelled() && steps.scan.outcome == 'success' && steps.integrity.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opportunities.json data/scan-status.json data/opportunity-ids.json data/programme-monitoring.json
          if [ -f data/notification-state.json ]; then git add data/notification-state.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh funding discovery"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
