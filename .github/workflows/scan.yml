name: Scan funding sources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/scan.py'
      - 'src/source_alternatives.py'
      - 'src/eu_api.py'
      - 'src/verification.py'
      - 'src/classify.py'
      - 'src/detail.py'
      - 'src/quality.py'
      - 'src/status.py'
      - 'src/fit.py'
      - 'src/pdf_dates.py'
      - 'src/structured.py'
      - 'src/priority.py'
      - 'src/crt_windows.py'
      - 'config/priority_pages.json'
      - 'config/sources.json'
      - '.github/workflows/scan.yml'
  schedule:
    - cron: '0 6 * * 1,3,5'
permissions:
  contents: write
concurrency:
  group: funding-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/scan.py
      - name: Commit updated public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opportunities.json data/scan-status.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh funding discovery"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
