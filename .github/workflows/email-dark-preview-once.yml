name: One-time dark-mode email preview
on:
  push:
    branches: [main]
    paths:
      - 'src/email_dark_preview_once.py'
permissions:
  contents: read
jobs:
  preview:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send updated dark-mode email preview
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FUNDING_ALERT_RECIPIENT: ${{ secrets.FUNDING_ALERT_RECIPIENT }}
        run: python src/email_dark_preview_once.py
