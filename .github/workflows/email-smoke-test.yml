name: One-off email smoke test
on:
  push:
    branches: [main]
    paths:
      - 'src/email_smoke_test.py'
permissions:
  contents: read
jobs:
  send-test:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send one delivery test per configured recipient
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FUNDING_ALERT_RECIPIENT: ${{ secrets.FUNDING_ALERT_RECIPIENT }}
        run: python src/email_smoke_test.py
