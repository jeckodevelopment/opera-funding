name: Deploy funding dashboard
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/build_site.py'
      - 'src/deploy_sftp.py'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: opera-funding-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate dashboard
        run: |
          python -m unittest discover -s tests -v
          node --check web/app.js
          node tests/test_dashboard.cjs
          node tests/test_live_feed.cjs
      - name: Build static dashboard
        run: python src/build_site.py
      - name: Check SFTP configuration
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
        run: |
          if [ -z "$SFTP_HOST" ] || [ -z "$SFTP_USERNAME" ] || [ -z "$SFTP_REMOTE_DIR" ] || [ -z "$SFTP_KNOWN_HOSTS" ]; then
            echo "::error::SFTP deploy prerequisites are missing in repository secrets"
            exit 1
          fi
          if [ -z "$SFTP_PASSWORD" ] && [ -z "$SFTP_PRIVATE_KEY" ]; then
            echo "::error::SFTP authentication secret missing"
            exit 1
          fi
      - name: Deploy dashboard over verified-host SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
          SFTP_PORT: ${{ vars.SFTP_PORT }}
        run: |
          set -eu
          if [ -n "${SFTP_PRIVATE_KEY:-}" ]; then
            keyfile="$(mktemp)"
            chmod 600 "$keyfile"
            trap 'rm -f "$keyfile"' EXIT
            printf '%s\n' "$SFTP_PRIVATE_KEY" > "$keyfile"
            export SFTP_PRIVATE_KEY_FILE="$keyfile"
          fi
          python src/deploy_sftp.py
