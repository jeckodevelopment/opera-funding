name: One-time funding history backfill
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/history-backfill.yml'
      - 'src/scan.py'
      - 'src/eu_api.py'
permissions:
  contents: write
concurrency:
  group: funding-scan
  cancel-in-progress: false
jobs:
  historical-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify scan and API modules compile
        run: python -m compileall -q src
      - name: Inspect all outstanding historical opportunities and their documents
        run: python -u src/scan.py --history-backfill
      - name: Validate all catalogue entries and review coverage
        run: |
          python -m json.tool data/opportunities.json > /dev/null
          python -m json.tool data/scan-status.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path("data/opportunities.json").read_text(encoding="utf-8"))
          report=json.loads(Path("data/scan-status.json").read_text(encoding="utf-8"))
          assert rows and len(rows)==report["assessment_coverage"]["total"]
          assert all(r.get("assessment_label") and r.get("assessment_review_status") for r in rows)
          print("Historical assessment coverage:",report["assessment_coverage"])
          PY
      - name: Publish historical review results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/
          git status --short
          if ! git diff --cached --quiet; then
            git commit -m "data: complete historical opportunity evidence sweep"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
