name: Quality checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m json.tool config/sources.json > /dev/null
      - run: python -m json.tool data/opportunities.json > /dev/null
      - run: node --check web/app.js
      - run: python -m py_compile src/build_site.py src/deploy_sftp.py
      - run: python src/build_site.py
